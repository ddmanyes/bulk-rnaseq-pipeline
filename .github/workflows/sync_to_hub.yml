name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]  # 當 main 分支有更新時觸發

  # 手動觸發按鈕
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://chanchiru:$HF_TOKEN@huggingface.co/spaces/chanchiru/bulk-rnaseq-pipeline main
