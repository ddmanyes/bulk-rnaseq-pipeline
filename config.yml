files:
  input: input/merged_counts.csv
  gene_annotation: genesets/pair_GRCm39.tsv
  metadata: input/metadata.csv
  output_dir: output
  batch_correction:
    enabled: false
    batch_key: Batch
analysis:
  diff_expression:
    control_group: Control
    filter_low_expression: true
  significance:
    padj_threshold: 0.05
    log2fc_threshold: 1.0
  variable_heatmap:
    top_n_genes: 50
  enrichment:
    species: Mouse
    top_terms_to_plot: 15
    libraries:
      Reactome: Reactome_2022
      KEGG: KEGG_2019_Mouse
      GO_Biological: GO_Biological_Process_2023
  time_series:
    enabled: true
    num_clusters: 4
    top_n_genes: 2000
    k_evaluation:
      enabled: true
      max_k: 10
